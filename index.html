/* ============================== Ações ============================== */
const toast = msg => { const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; $('#toasts').appendChild(t); setTimeout(() => t.remove(), 3400); };
const weekdayOk = date => { const w = D.parse(date).getDay(); if (w === 0 || w === 6) { toast('Escolha um dia útil (segunda a sexta).'); return false; } return true; };
function addExec(i, mins, status, note) {
  const a = i.a, prior = (S.notes[i.id] || []).map(n => n.text), text = [...prior, (note || '').trim()].filter(Boolean).join(' · ');
  S.executions = S.executions.filter(e => !(e.actId === a.id && e.date === i.orig));
  S.executions.push({ id: uid('e'), actId: a.id, date: i.orig, userId: a.userId, name: a.name, procId: a.procId, refMin: a.refMin, realMin: mins, status, note: text });
  delete S.notes[i.id];
}
function bump(v) { const [a, b] = v.split('.').map(Number); return `${a}.${(b || 0) + 1}`; }
const done = (msg) => { save(); closeModal(); render(); if (msg) toast(msg); };

const A = {
  navToggle() { document.body.classList.toggle('nav-open'); },
  profile(d) { location.hash = '#/' + d.p + '/' + ROUTES[d.p][0][0]; },
  go(d) { location.hash = d.href; },
  closeModal() { closeModal(); },
  closeDrawer() { UI.drawer = null; renderDrawer(); },
  reset() { if (!confirm('Restaurar os dados de demonstração? Registros e alterações feitos neste navegador serão perdidos.')) return; S = buildSeed(); save(); UI.drawer = null; UI.modal = null; render(); toast('Dados de demonstração restaurados.'); },
  about() { document.body.classList.remove('nav-open'); openModal({ type: 'about' }); },
  /* agenda */
  selDay(d) { UI.day = d.d; UI.mon = D.monday(d.d); render(); },
  weekPrev() { UI.mon = D.add(UI.mon, -7); UI.day = D.add(UI.day, -7); render(); },
  weekNext() { UI.mon = D.add(UI.mon, 7); UI.day = D.add(UI.day, 7); render(); },
  weekToday() { UI.day = TODAY; UI.mon = D.monday(TODAY); render(); },
  detail(d) { openModal({ type: 'detail', inst: d.inst }); },
  std(d) { UI.drawer = { procId: d.p || null, instId: d.inst || null, tab: 'std', done: {} }; if (UI.modal && UI.modal.type !== 'exec') closeModal(); renderDrawer(); },
  drTab(d) { UI.drawer.tab = d.t; renderDrawer(); },
  doc(d) { openModal({ type: 'doc', p: d.p, k: d.k, i: +d.i }); },
  procCat(d) { UI.f.procCat = d.c; render(); },
  hMore() { UI.f.hLimit += 60; render(); },
  /* cronômetro */
  start(d) {
    if (S.timer && S.timer.instId !== d.inst) { toast('Você já tem uma atividade em andamento. Finalize-a antes de iniciar outra.'); return A.openTimer(); }
    if (!S.timer) S.timer = { instId: d.inst, acc: 0, running: true, since: Date.now(), note: '', checks: {} };
    save(); renderTop(); openModal({ type: 'exec', inst: S.timer.instId, stage: 'run' }); render();
  },
  openTimer() { if (S.timer) openModal({ type: 'exec', inst: S.timer.instId, stage: 'run' }); },
  pause() { const t = S.timer; if (!t || !t.running) return; t.acc += Date.now() - t.since; t.running = false; save(); renderTop(); renderModal(); },
  resume() { const t = S.timer; if (!t || t.running) return; t.since = Date.now(); t.running = true; save(); renderTop(); renderModal(); },
  finish() { const t = S.timer; if (!t) return; if (t.running) { t.acc += Date.now() - t.since; t.running = false; } save(); renderTop(); openModal({ type: 'exec', inst: t.instId, stage: 'confirm', elapsed: t.acc }); },
  execBack() { openModal({ type: 'exec', inst: S.timer.instId, stage: 'run' }); },
  discard() { if (!confirm('Descartar esta execução? O tempo cronometrado não será salvo.')) return; S.timer = null; save(); closeModal(); render(); toast('Execução descartada.'); },
  demoPlus() { const t = S.timer; if (!t) return; t.acc += 5 * 60000; save(); $$('[data-clock]').forEach(n => n.textContent = clock(elapsedMs() / 1000)); toast('Simulados +5 min no cronômetro (apenas demonstração).'); },
  execSave(fd) {
    const m = UI.modal, i = getInst(m.inst), mins = Math.round(Number(fd.get('mins')));
    if (!(mins > 0)) return toast('Informe o tempo em minutos (mínimo 1).');
    addExec(i, mins, fd.get('status'), fd.get('note')); S.timer = null; done(`Registro salvo · ${mins} min em "${i.a.name}"`);
  },
  manualNew(d) { openModal({ type: 'manual', id: d.id || '', date: d.date || '' }); },
  manualSave(fd) {
    const a = act(fd.get('act')), date = fd.get('date'), mins = Math.round(Number(fd.get('mins')));
    if (!a || !date || !(mins > 0)) return toast('Preencha atividade, data e tempo.');
    addExec(mk(a, date, date, a.time), mins, fd.get('status'), fd.get('note')); done(`Registro salvo · ${mins} min em "${a.name}"`);
  },
  noteOpen(d) { openModal({ type: 'note', inst: d.inst }); },
  noteSave(fd) { const id = UI.modal.inst, t = (fd.get('text') || '').trim(); if (!t) return; (S.notes[id] = S.notes[id] || []).push({ date: TODAY, text: t }); done('Observação adicionada.'); },
  /* atividades */
  actNew(d) { openModal({ type: 'actForm', id: '', date: d.date || '' }); },
  actEdit(d) { openModal({ type: 'actForm', id: d.id, date: d.date || '' }); },
  actSave(fd) {
    const id = fd.get('id'), name = (fd.get('name') || '').trim(), date = fd.get('date');
    if (!name) return toast('Informe o nome da atividade.');
    if (!date || !weekdayOk(date)) return;
    const freq = fd.get('frequency'), ref = fd.get('refMin') ? Number(fd.get('refMin')) : null, mgr = UI.p === 'g';
    let a = id ? act(id) : null; const old = a ? a.frequency : null;
    if (!a) { a = { id: uid('a'), moved: {}, ended: false, start: date }; S.activities.push(a); }
    Object.assign(a, { name, description: (fd.get('description') || '').trim(), userId: mgr ? fd.get('userId') : ME.c, procId: fd.get('procId') || null, refMin: ref, frequency: freq, time: fd.get('time') || '09:00' });
    if (!id || freq === 'Pontual' || old !== freq) a.start = date;
    a.wd = D.parse(date).getDay(); a.dom = D.parse(date).getDate();
    if (!a.refMin && a.procId) a.refMin = proc(a.procId).refMin;
    if (UI.p === 'c') { UI.day = date; UI.mon = D.monday(date); }
    done(mgr ? `Atividade na agenda de ${PEOPLE[a.userId].name}.` : `Atividade salva para ${fmtShort(date)}.`);
  },
  resched(d) { openModal({ type: 'resched', inst: d.inst }); },
  reschedSave(fd) {
    const i = getInst(UI.modal.inst), a = i.a, date = fd.get('date'), time = fd.get('time');
    if (!weekdayOk(date)) return;
    const scope = fd.get('scope') || 'series';
    if (a.frequency === 'Pontual') { a.start = date; a.time = time; }
    else if (scope === 'this') a.moved[i.orig] = { date, time };
    else { a.time = time; if (a.frequency === 'Semanal') a.wd = D.parse(date).getDay(); if (a.frequency === 'Mensal') a.dom = D.parse(date).getDate(); }
    UI.day = date; UI.mon = D.monday(date); done('Atividade reagendada.');
  },
  assoc(d) { openModal({ type: 'assoc', name: d.name }); },
  assocSave(fd) {
    const n = fd.get('name'), pid = fd.get('procId'); if (!pid) return toast('Selecione um procedimento.');
    S.activities.filter(a => a.name === n).forEach(a => { a.procId = pid; if (!a.refMin) a.refMin = proc(pid).refMin; });
    UI.drawer = null; done(`Procedimento associado a "${n}".`);
  },
  hist(d) { openModal({ type: 'hist', id: d.id }); },
  /* sugestões */
  sugNew(d) { UI.drawer = null; renderDrawer(); openModal({ type: 'sugForm', activity: d.activity || '' }); },
  sugSave(fd) {
    S.suggestions.push({ id: uid('s'), userId: ME.c, activity: fd.get('activity'), date: TODAY, description: fd.get('description').trim(), suggestion: fd.get('suggestion').trim(), status: 'Nova', response: '' });
    done('Sugestão enviada para a gestão.');
  },
  sugReply(d) { openModal({ type: 'sugReply', id: d.id }); },
  sugReplySave(fd) { const s = S.suggestions.find(x => x.id === fd.get('id')); s.status = fd.get('status'); s.response = (fd.get('response') || '').trim(); done('Análise salva.'); },
  melGo(d) { UI.f.melAct = d.n; location.hash = '#/g/melhorias'; },
  melClear() { UI.f.melAct = ''; render(); },
  /* gestão */
  gStatus(d) { UI.f.gStatus = UI.f.gStatus === d.s ? '' : d.s; render(); },
  gStatusGo(d) { UI.f.gStatus = d.s; location.hash = '#/g/gestao'; },
  gOldGo() { UI.f.gOld = true; },
  dNoGo() { UI.f.dNo = true; },
  gClear() { Object.assign(UI.f, { gStatus: '', gOwner: '', gOld: false, gQ: '' }); render(); },
  anSel(d) { UI.an = d.n; render(); },
  adjRef(d) { openModal({ type: 'adjRef', n: d.n }); },
  adjRefSave(fd) {
    const n = fd.get('n'), ref = Math.round(Number(fd.get('ref'))); if (!(ref > 0)) return toast('Informe um tempo válido.');
    const acts = S.activities.filter(a => a.name === n), pid = (acts.find(a => a.procId) || {}).procId, p = pid ? proc(pid) : null;
    acts.forEach(a => a.refMin = ref);
    if (p) { const was = p.refMin; p.refMin = ref; p.updated = TODAY; p.version = bump(p.version); p.history.unshift({ date: TODAY, who: ME.g, note: `Tempo de referência ajustado de ${was} para ${ref} min (análise dos processos)` }); }
    done(`Tempo de referência de "${n}" atualizado para ${ref} min.`);
  },
  procNew(d) { UI.pf = blankProc(d.name); UI.drawer = null; renderDrawer(); openModal({ type: 'procForm' }); },
  procEdit(d) { UI.pf = procToForm(proc(d.id)); openModal({ type: 'procForm' }); },
  stepAdd() { readProcForm(new FormData($('#mform'))); UI.pf.steps.push({ t: '', d: '' }); renderModal(); },
  stepDel(d) { readProcForm(new FormData($('#mform'))); UI.pf.steps.splice(+d.i, 1); if (!UI.pf.steps.length) UI.pf.steps.push({ t: '', d: '' }); renderModal(); },
  stepMove(d) { readProcForm(new FormData($('#mform'))); const s = UI.pf.steps, i = +d.i, j = i + +d.d; if (j < 0 || j >= s.length) return; [s[i], s[j]] = [s[j], s[i]]; renderModal(); },
  procSave(fd) {
    readProcForm(fd); const pf = UI.pf, steps = pf.steps.filter(s => s.t.trim()).map(s => ({ t: s.t.trim(), d: s.d.trim() }));
    if (!pf.name.trim()) return toast('Informe o nome.'); if (!steps.length) return toast('Inclua ao menos uma etapa.');
    const lines = k => pf[k].split('\n').map(x => x.trim()).filter(Boolean);
    const keep = (k, old, t) => lines(k).map(n => old.find(o => o.n === n) || { n, t, s: 'Material fictício' });
    const old = pf.id ? proc(pf.id) : null;
    const data = { name: pf.name.trim(), category: pf.category, description: pf.description.trim(), objective: pf.objective.trim(), frequency: pf.frequency, refMin: pf.refMin ? Number(pf.refMin) : null, owner: pf.owner, capable: pf.capable, steps,
      systems: lines('systems'), docs: keep('docs', old ? old.docs : [], 'DOCX'), materials: keep('materials', old ? old.materials : [], 'Guia'), updated: TODAY };
    let p;
    if (old) { p = old; const ver = p.status === 'Rascunho' ? p.version : bump(p.version); Object.assign(p, data, { version: ver }); p.history.unshift({ date: TODAY, who: ME.g, note: (pf.summary || '').trim() || `Procedimento editado (v${ver})` }); }
    else { p = { id: uid('proc'), status: 'Rascunho', version: '0.1', ...data, history: [{ date: TODAY, who: ME.g, note: 'Procedimento criado como rascunho' }] }; S.procedures.push(p); }
    UI.drawer = { procId: p.id, tab: 'std', done: {} }; done(old ? 'Procedimento atualizado.' : 'Rascunho criado. Percorra o fluxo de revisão para publicar.');
  },
  procFlow(d) {
    const p = proc(d.id), idx = WORKFLOW.indexOf(p.status), to = idx + Number(d.dir);
    if (to < 0 || to >= WORKFLOW.length) return;
    if (p.status === 'Publicado' && !confirm('Despublicar este procedimento? Os colaboradores deixarão de visualizá-lo.')) return;
    p.status = WORKFLOW[to]; p.updated = TODAY;
    if (p.status === 'Publicado' && p.version.startsWith('0.')) p.version = '1.0';
    p.history.unshift({ date: TODAY, who: ME.g, note: `Situação alterada para "${p.status}"` });
    save(); render(); toast(p.status === 'Publicado' ? 'Publicado. Agora os colaboradores podem consultar este procedimento.' : `Situação: ${p.status}`);
  }
};

/* ============================== Eventos ============================== */
document.addEventListener('click', e => {
  if (e.target.closest('.nav-item')) document.body.classList.remove('nav-open');
  const el = e.target.closest('[data-act]'); if (!el) return;
  const fn = A[el.dataset.act]; if (fn) { if (el.tagName !== 'A') e.preventDefault(); fn(el.dataset, el, e); }
});
document.addEventListener('submit', e => {
  const f = e.target.closest('form[data-submit]'); if (!f) return;
  e.preventDefault(); A[f.dataset.submit](new FormData(f), f);
});
function onFilter(e) {
  const t = e.target; if (!t.dataset || !t.dataset.filter) return;
  const txt = t.type === 'search' || t.type === 'text';
  if ((e.type === 'input') !== txt) return;
  UI.f[t.dataset.filter] = t.type === 'checkbox' ? t.checked : t.value;
  if (t.dataset.filter === 'hPer' || t.dataset.filter === 'hQ') UI.f.hLimit = 60;
  const pos = t.selectionStart; render();
  if (txt) { const n = $(`[data-filter="${t.dataset.filter}"]`); if (n) { n.focus(); try { n.setSelectionRange(pos, pos); } catch (_) { /* ok */ } } }
}
document.addEventListener('input', e => {
  onFilter(e);
  if (e.target.matches('[data-timernote]') && S.timer) { S.timer.note = e.target.value; save(); }
});
document.addEventListener('change', e => {
  onFilter(e);
  const t = e.target;
  if (t.matches('[data-timerchk]') && S.timer) { S.timer.checks = S.timer.checks || {}; S.timer.checks[t.dataset.timerchk] = t.checked; save(); t.closest('.step').classList.toggle('ok', t.checked); }
  if (t.matches('[data-stepchk]') && UI.drawer) { UI.drawer.done[t.dataset.stepchk] = t.checked; t.closest('.step').classList.toggle('ok', t.checked); }
  if (t.matches('[data-onproc]')) { const p = proc(t.value), r = $('[name=refMin]', t.form); if (p && r && !r.value) r.value = p.refMin; }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { if (UI.modal) closeModal(); else if (UI.drawer) A.closeDrawer(); }
  if (e.key === 'Enter' && e.target.id === 'gsearch') {
    const q = e.target.value; if (UI.p === 'c') { UI.f.procQ = q; location.hash = '#/c/procedimentos'; } else { UI.f.gQ = q; location.hash = '#/g/gestao'; }
    if (location.hash === (UI.p === 'c' ? '#/c/procedimentos' : '#/g/gestao')) render();
  }
});
window.addEventListener('hashchange', () => { UI.drawer = null; UI.modal = null; render(); $('#main').scrollTop = 0; });
setInterval(() => {
  if (!S.timer) return;
  const s = elapsedMs() / 1000; $$('[data-clock]').forEach(n => n.textContent = clock(s));
  const pr = $('[data-prog]'); if (pr) { const i = getInst(S.timer.instId); if (i && i.a.refMin) pr.style.width = Math.min(100, s / 60 / i.a.refMin * 100) + '%'; }
}, 500);

if (!location.hash) location.hash = '#/c/rotina';
render();

</script>
</body>
</html>
