<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Trabalho Padrão · Gestão de processos e melhoria contínua</title>
  <meta name="description" content="Protótipo funcional para gestão de atividades recorrentes, padronização de processos e melhoria contínua em equipes de TI.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230F6CBD'/%3E%3Cpath d='M9 16.5l4.5 4.5L23 11' stroke='white' stroke-width='3' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <style>
/* Trabalho Padrão — visual inspirado no Fluent Design (identidade própria) */
:root{
  --brand:#0F6CBD; --brand-d:#115EA3; --brand-dd:#0C3B5E; --brand-l:#EBF3FC; --brand-ll:#F5F9FD;
  --top:#0C4A82; --teal:#0E7C86; --teal-l:#E3F4F5;
  --ink:#242424; --ink2:#424242; --muted:#616161; --muted2:#8A8A8A;
  --line:#E0E0E0; --line2:#EEEEEE; --bg:#F5F6F8; --card:#fff;
  --green:#107C10; --green-l:#E7F4E7; --amber:#8A5A00; --amber-l:#FFF4DB; --gray-l:#F0F0F0;
  --r:6px; --r2:8px;
  --sh:0 1px 2px rgba(0,0,0,.08),0 0 2px rgba(0,0,0,.05);
  --sh2:0 12px 32px rgba(0,0,0,.18),0 0 2px rgba(0,0,0,.12);
  --font:"Segoe UI Variable","Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{font-family:var(--font);color:var(--ink);background:var(--bg);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
h1,h2,h3,h4,p{margin:0}
a{color:var(--brand);text-decoration:none}
.ic{flex:none;vertical-align:middle}
#app{display:flex;flex-direction:column;height:100vh}
.shell{display:flex;flex:1;min-height:0}

/* Topbar */
.topbar{height:48px;background:var(--top);color:#fff;display:flex;align-items:center;gap:14px;padding:0 14px;flex:none;position:relative;z-index:30}
.burger{display:none;background:none;border:0;color:#fff;padding:6px;border-radius:6px}
.brand{display:flex;align-items:center;gap:10px;font-weight:600;font-size:15px;white-space:nowrap}
.brand-mark{width:26px;height:26px;border-radius:7px;background:#fff;display:grid;place-items:center}
.brand small{font-weight:400;opacity:.75;font-size:12px;padding-left:10px;border-left:1px solid rgba(255,255,255,.3)}
.top-search{flex:1;max-width:420px;margin-left:12px;position:relative}
.topbar .top-search input{width:100%;height:32px;border-radius:6px;border:0;background:rgba(255,255,255,.16);color:#fff;border:0;border-bottom:0;padding:0 12px 0 34px;font:inherit}
.topbar .top-search input::placeholder{color:rgba(255,255,255,.75)}
.topbar .top-search input:focus{outline:2px solid #fff;background:rgba(255,255,255,.24)}
.top-search .ic{position:absolute;left:10px;top:8px;opacity:.9;color:#fff;pointer-events:none}
.top-r{margin-left:auto;display:flex;align-items:center;gap:12px}
.pill{font-size:12px;background:rgba(255,255,255,.14);padding:4px 10px;border-radius:999px;white-space:nowrap}
.tpill{display:flex;align-items:center;gap:8px;background:#fff;color:var(--brand-dd);border:0;border-radius:999px;padding:4px 12px;font-weight:600;font-size:12.5px;max-width:260px}
.tpill i{width:8px;height:8px;border-radius:50%;background:var(--teal);animation:blink 1.2s infinite}
.tpill.paused i{background:#C19C00;animation:none}
.tpill span.n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500;color:var(--ink2)}
@keyframes blink{50%{opacity:.25}}
.seg{display:flex;background:rgba(255,255,255,.14);border-radius:8px;padding:2px}
.seg button{border:0;background:none;color:#fff;padding:5px 12px;border-radius:6px;font-size:13px;opacity:.85}
.seg button.on{background:#fff;color:var(--brand-dd);font-weight:600;opacity:1}
.who{display:flex;align-items:center;gap:8px;line-height:1.15}
.who b{font-size:13px;font-weight:600;display:block}
.who small{font-size:11.5px;opacity:.8}
.av{display:inline-grid;place-items:center;border-radius:50%;color:#fff;font-weight:600;flex:none;width:28px;height:28px;font-size:11px}
.icon-btn{border:0;background:none;padding:6px;border-radius:6px;color:inherit;display:inline-grid;place-items:center}
.icon-btn:hover{background:rgba(0,0,0,.06)}

/* Sidebar */
.sidebar{width:248px;flex:none;background:#fff;border-right:1px solid var(--line);padding:14px 10px;display:flex;flex-direction:column;gap:2px;overflow:auto}
.side-h{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted2);padding:6px 12px 8px;font-weight:600}
.nav-item{display:flex;align-items:center;gap:12px;padding:9px 12px;border-radius:6px;color:var(--ink2);font-weight:500;position:relative}
.nav-item:hover{background:var(--gray-l)}
.nav-item.on{background:var(--brand-l);color:var(--brand-dd);font-weight:600}
.nav-item.on::before{content:"";position:absolute;left:0;top:9px;bottom:9px;width:3px;border-radius:3px;background:var(--brand)}
.side-foot{margin-top:auto;padding:12px;border-top:1px solid var(--line2);font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:8px}
.side-foot button{border:0;background:none;color:var(--brand);padding:0;text-align:left;font-size:12.5px}
.side-foot button:hover{text-decoration:underline}

/* Main */
.main{flex:1;overflow:auto;padding:24px 28px 56px;min-width:0}
.main:focus{outline:none}
.page{max-width:1280px;margin:0 auto}
.phead{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:20px;flex-wrap:wrap}
.eyebrow{font-size:12px;font-weight:600;color:var(--brand);text-transform:uppercase;letter-spacing:.06em;margin-bottom:2px}
.phead h1{font-size:26px;font-weight:600;letter-spacing:-.01em}
.phead p{color:var(--muted);margin-top:4px;max-width:720px}
.phead-r{display:flex;gap:8px;flex-wrap:wrap}

/* Cards, grids */
.card{background:var(--card);border-radius:var(--r2);box-shadow:var(--sh);border:1px solid var(--line2)}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px 0;flex-wrap:wrap}
.card-h h2{font-size:15px;font-weight:600}
.card-h small{color:var(--muted);font-size:12px}
.card-b{padding:14px 16px 16px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g-ms{grid-template-columns:minmax(0,1.7fr) minmax(0,1fr)}
.g-sm{grid-template-columns:minmax(0,1fr) minmax(0,1.5fr)}
.mt{margin-top:16px}
.note{display:flex;gap:10px;align-items:flex-start;background:var(--brand-ll);border:1px solid #D6E6F7;color:var(--brand-dd);padding:10px 14px;border-radius:var(--r2);font-size:13px}
.note .ic{margin-top:1px;color:var(--brand)}
.note.warn{background:var(--amber-l);border-color:#F2DDA6;color:#5E3E00}
.note.warn .ic{color:var(--amber)}

/* KPI */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:#fff;border-radius:var(--r2);padding:14px 16px;box-shadow:var(--sh);border:1px solid var(--line2);border-top:3px solid var(--brand)}
.kpi.t{border-top-color:var(--teal)}.kpi.g{border-top-color:var(--green)}.kpi.s{border-top-color:#A9B4C0}.kpi.a{border-top-color:#C19C00}
.kpi-l{font-size:12px;color:var(--muted);font-weight:500}
.kpi-v{font-size:28px;font-weight:600;line-height:1.15;margin-top:4px;letter-spacing:-.02em}
.kpi-s{font-size:12px;color:var(--muted);margin-top:2px}

/* Buttons */
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid #C7C7C7;background:#fff;color:var(--ink);border-radius:var(--r);padding:6px 12px;font-weight:600;font-size:13px;line-height:1.2;white-space:nowrap;text-decoration:none}
.btn:hover{background:#F5F5F5}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.primary:hover{background:var(--brand-d)}
.btn.subtle{border-color:transparent;background:var(--gray-l)}
.btn.subtle:hover{background:#E6E6E6}
.btn.ghost{border-color:transparent;background:none;color:var(--brand);font-weight:600}
.btn.ghost:hover{background:var(--brand-l)}
.btn.sm{padding:4px 9px;font-size:12.5px}
.btn:disabled,.btn.dis{opacity:.5;cursor:not-allowed}
.btn.danger{color:#A4262C}
.btn:focus-visible,.nav-item:focus-visible,.ev:focus-visible,.cal-day:focus-visible,button:focus-visible{outline:2px solid var(--brand);outline-offset:2px}

/* Badges */
.badge{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;white-space:nowrap;background:var(--gray-l);color:var(--ink2)}
.b-blue{background:var(--brand-l);color:var(--brand-d)}
.b-teal{background:var(--teal-l);color:#07555C}
.b-green{background:var(--green-l);color:#0B5A0B}
.b-amber{background:var(--amber-l);color:#7A4E00}
.b-gray{background:var(--gray-l);color:var(--ink2)}
.b-outline{background:#fff;border:1px solid var(--line);color:var(--muted);font-weight:500}
.b-dashed{background:#fff;border:1px dashed #9AA7B5;color:var(--muted);font-weight:500}
.b-blue-o{background:#fff;border:1px solid #B4D6FA;color:var(--brand-d);font-weight:500}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chip-btn{border:1px solid var(--line);background:#fff;border-radius:999px;padding:4px 12px;font-size:13px;color:var(--ink2)}
.chip-btn.on{background:var(--brand);border-color:var(--brand);color:#fff}
.chip-btn:hover:not(.on){background:var(--gray-l)}

/* Forms */
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
.field label,.lbl{font-size:12.5px;font-weight:600;color:var(--ink2)}
.field small{color:var(--muted);font-size:12px}
input[type=text],input[type=search],input[type=number],input[type=date],input[type=time],select,textarea{font:inherit;color:var(--ink);border:1px solid #C7C7C7;border-bottom-color:#8A8A8A;border-radius:var(--r);padding:7px 10px;background:#fff;width:100%;min-width:0}
textarea{resize:vertical;min-height:72px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--brand);outline-offset:-1px;border-color:var(--brand)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.chk{display:flex;align-items:center;gap:8px;font-size:13px}
.chk input{width:16px;height:16px;accent-color:var(--brand)}
.chk-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:6px 12px}
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;margin-bottom:14px}
.filters .field{margin:0;min-width:160px}
.sbox{position:relative;min-width:240px}
.sbox input{padding-left:32px}
.sbox .ic{position:absolute;left:10px;top:9px;color:var(--muted)}

/* Tables */
.tbl-wrap{overflow:auto}
table.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th{position:sticky;top:0;background:#FAFAFA;text-align:left;font-size:12px;color:var(--muted);font-weight:600;padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:10px 12px;border-bottom:1px solid var(--line2);vertical-align:middle}
.tbl tbody tr:hover{background:var(--brand-ll)}
.tbl tr.click{cursor:pointer}
.tbl .num{text-align:right;font-variant-numeric:tabular-nums}
.tbl tfoot td{font-weight:600;background:#FAFAFA}
.cell-name{display:flex;gap:10px;align-items:center}
.cell-name b{font-weight:600;display:block}
.cell-name small{color:var(--muted);font-size:12px;display:block}
.fileic{width:32px;height:32px;border-radius:6px;background:var(--brand-l);color:var(--brand);display:grid;place-items:center;flex:none}
.row-acts{display:flex;gap:4px;justify-content:flex-end;flex-wrap:wrap}
.person{display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
.person .av{width:22px;height:22px;font-size:9.5px}
.avs{display:inline-flex}
.avs .av{width:24px;height:24px;font-size:9.5px;margin-left:-6px;border:2px solid #fff}
.avs .av:first-child{margin-left:0}
.empty{text-align:center;padding:36px 16px;color:var(--muted)}
.empty .ic{color:#A9B4C0;margin-bottom:6px}
.empty h3{color:var(--ink);font-size:15px;margin-bottom:4px}

/* Calendar */
.cal{border:1px solid var(--line);border-radius:var(--r2);overflow:auto;background:#fff}
.cal-in{min-width:780px}
.cal-head,.cal-body{display:grid;grid-template-columns:56px repeat(5,minmax(0,1fr))}
.cal-head{border-bottom:1px solid var(--line);background:#FAFAFA;position:sticky;top:0;z-index:2}
.cal-day{border:0;background:none;padding:8px 6px 6px;text-align:center;border-left:1px solid var(--line2);color:var(--muted);font-size:12px}
.cal-day b{display:block;font-size:18px;color:var(--ink);font-weight:600;margin-top:1px}
.cal-day.today b{background:var(--brand);color:#fff;border-radius:50%;width:30px;height:30px;line-height:30px;margin:1px auto 0}
.cal-day.sel{background:var(--brand-l);box-shadow:inset 0 -3px 0 var(--brand)}
.cal-day:hover{background:var(--gray-l)}.cal-day.sel:hover{background:var(--brand-l)}
.cal-times div{font-size:11px;color:var(--muted2);text-align:right;padding-right:8px;transform:translateY(-7px)}
.cal-col{position:relative;border-left:1px solid var(--line2);background-image:linear-gradient(to bottom,var(--line2) 1px,transparent 1px)}
.cal-col.today{background-color:#FBFDFF}
.cal-col.sel{background-color:var(--brand-ll)}
.now{position:absolute;left:0;right:0;height:2px;background:#C50F1F;z-index:1}
.now::before{content:"";position:absolute;left:-4px;top:-3px;width:8px;height:8px;border-radius:50%;background:#C50F1F}
.ev{position:absolute;padding:3px 6px;border-radius:5px;border:0;border-left:3px solid var(--brand);background:var(--brand-l);color:var(--brand-dd);font-size:12px;line-height:1.25;overflow:hidden;cursor:pointer;text-align:left;z-index:1}
.ev b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:.85}
.ev:hover{filter:brightness(.97);z-index:3;box-shadow:var(--sh)}
.ev.s-run{background:var(--teal-l);border-left-color:var(--teal);color:#07555C}
.ev.s-done{background:var(--green-l);border-left-color:var(--green);color:#0B5A0B}
.ev.s-none{background:#F3F3F3;border-left-color:#A8A8A8;color:#616161}
.ev.s-part{background:var(--amber-l);border-left-color:#C19C00;color:#7A4E00}
.ev.s-stop{background:#F3F3F3;border-left-color:#C19C00;color:#616161}
.ev.nostd{border-style:dashed;border-top:1px dashed #9AA7B5;border-right:1px dashed #9AA7B5;border-bottom:1px dashed #9AA7B5}
.cal-legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:10px}
.cal-legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.calbar{display:flex;gap:8px;align-items:center}
.calbar b{font-size:14px;min-width:150px;text-align:center}

/* Activity list */
.acts{display:flex;flex-direction:column;gap:10px}
.act{display:grid;grid-template-columns:78px minmax(0,1fr) auto;gap:14px;padding:14px;border:1px solid var(--line2);border-radius:var(--r2);background:#fff;align-items:center}
.act:hover{border-color:#C9DDF2}
.act.done{background:#FAFCFA}
.act-time b{display:block;font-size:17px;font-weight:600}
.act-time span{font-size:12px;color:var(--muted)}
.act-main h4{font-size:14.5px;font-weight:600}
.act-main p{color:var(--muted);font-size:13px;margin:2px 0 8px}
.act-btns{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;max-width:420px}

/* Modal */
.modal-root{position:fixed;inset:0;z-index:60;display:grid;place-items:center;padding:16px}
.modal-back{position:absolute;inset:0;background:rgba(0,0,0,.4)}
.modal{position:relative;background:#fff;border-radius:10px;box-shadow:var(--sh2);width:100%;max-width:560px;max-height:calc(100vh - 32px);display:flex;flex-direction:column}
.modal.wide{max-width:760px}.modal.xl{max-width:900px}.modal.sm{max-width:440px}
.modal-h{display:flex;align-items:center;justify-content:space-between;padding:16px 20px 8px}
.modal-h h2{font-size:18px;font-weight:600}
.modal-b{padding:8px 20px 16px;overflow:auto}
.modal-f{display:flex;justify-content:flex-end;gap:8px;padding:12px 20px;border-top:1px solid var(--line2);flex-wrap:wrap;background:#FAFAFA;border-radius:0 0 10px 10px}
.kv{display:grid;grid-template-columns:150px 1fr;gap:8px 14px;font-size:13.5px;margin-bottom:6px}
.kv dt{color:var(--muted)}.kv dd{margin:0}
.sec-t{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin:16px 0 8px}
.mini-list{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:6px;font-size:13px}
.mini-list li{display:flex;justify-content:space-between;gap:10px;padding:6px 10px;background:#FAFAFA;border-radius:6px}

/* Drawer */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.3);z-index:40}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,100vw);background:#fff;z-index:50;box-shadow:var(--sh2);display:flex;flex-direction:column;animation:slide .18s ease-out}
@keyframes slide{from{transform:translateX(40px);opacity:0}}
.dr-h{padding:18px 20px 12px;border-bottom:1px solid var(--line2)}
.dr-h .row{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.dr-h h2{font-size:20px;font-weight:600;margin:6px 0 6px}
.dr-b{flex:1;overflow:auto;padding:4px 20px 28px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line2);margin:10px -20px 0;padding:0 20px}
.tabs button{border:0;background:none;padding:8px 12px;color:var(--muted);font-weight:600;border-bottom:3px solid transparent}
.tabs button.on{color:var(--brand-dd);border-bottom-color:var(--brand)}
.steps{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:10px;counter-reset:s}
.step{display:flex;gap:12px;padding:12px;border:1px solid var(--line2);border-radius:var(--r2);background:#fff}
.step .n{width:26px;height:26px;border-radius:50%;background:var(--brand-l);color:var(--brand-d);display:grid;place-items:center;font-weight:600;font-size:13px;flex:none}
.step.ok{background:#FAFCFA}.step.ok .n{background:var(--green);color:#fff}
.step b{display:block;font-weight:600}.step p{color:var(--muted);font-size:13px;margin-top:2px}
.step label{display:flex;gap:10px;cursor:pointer;width:100%}
.step input{margin-top:4px;accent-color:var(--green);width:16px;height:16px;flex:none}
.res-list{display:flex;flex-direction:column;gap:6px}
.doc{display:flex;align-items:center;gap:10px;padding:8px 10px;border:1px solid var(--line2);border-radius:var(--r);background:#fff;text-align:left;width:100%}
.doc:hover{background:var(--brand-ll);border-color:#C9DDF2}
.doc b{display:block;font-weight:600;font-size:13px}.doc small{color:var(--muted)}
.doc .fileic{width:30px;height:30px}
.docpage{background:#fff;border:1px solid var(--line);box-shadow:var(--sh);padding:28px 32px;border-radius:4px;min-height:260px}
.docpage h3{font-size:18px;margin-bottom:4px}
.docpage .sk{height:8px;border-radius:4px;background:#ECEFF3;margin:9px 0}
.docpage ul{margin:10px 0 10px 18px;padding:0;color:var(--ink2);font-size:13px}
.docpage table{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:10px}
.docpage th,.docpage td{border:1px solid var(--line);padding:5px 8px;text-align:left}
.docpage th{background:#F3F6FA}
.player{height:200px;background:linear-gradient(135deg,#0C3B5E,#0F6CBD);border-radius:6px;display:grid;place-items:center;color:#fff}

/* Workflow */
.flow{list-style:none;display:flex;margin:0;padding:0;gap:6px;flex-wrap:wrap}
.flow li{flex:1;min-width:110px;display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:6px;background:var(--gray-l);color:var(--muted);font-weight:600;font-size:13px}
.flow li span{width:22px;height:22px;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:12px;flex:none}
.flow li.done{background:var(--green-l);color:#0B5A0B}.flow li.done span{background:var(--green);color:#fff}
.flow li.cur{background:var(--brand);color:#fff}.flow li.cur span{color:var(--brand)}
.pipe{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
.pipe button{background:#fff;border:1px solid var(--line2);box-shadow:var(--sh);border-radius:var(--r2);padding:12px 14px;text-align:left;border-top:3px solid #A9B4C0}
.pipe button.on{outline:2px solid var(--brand)}
.pipe b{display:block;font-size:24px;font-weight:600}.pipe span{color:var(--muted);font-size:12.5px}
.pipe button:nth-child(2){border-top-color:#C19C00}.pipe button:nth-child(3){border-top-color:var(--teal)}.pipe button:nth-child(4){border-top-color:var(--brand)}

/* Cycle strip */
.cycle{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:0;margin-bottom:16px;background:#fff;border-radius:var(--r2);box-shadow:var(--sh);border:1px solid var(--line2);overflow:hidden}
.cycle a{padding:12px 14px 12px 22px;position:relative;color:var(--ink);border-right:1px solid var(--line2);clip-path:none}
.cycle a:last-child{border-right:0}
.cycle a:hover{background:var(--brand-ll)}
.cycle a::after{content:"›";position:absolute;right:6px;top:50%;transform:translateY(-50%);color:#A9B4C0;font-size:20px}
.cycle a:last-child::after{display:none}
.cycle i{font-style:normal;font-size:11px;font-weight:600;color:var(--brand);text-transform:uppercase;letter-spacing:.05em}
.cycle b{display:block;font-size:18px;font-weight:600;margin:2px 0}
.cycle span{font-size:12px;color:var(--muted)}

/* Charts */
.sbars{display:flex;flex-direction:column;gap:12px}
.sb-row{display:grid;grid-template-columns:150px minmax(0,1fr) auto;gap:12px;align-items:center;font-size:13px}
.sb-l{display:flex;align-items:center;gap:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sb-track{height:20px;background:#F3F4F6;border-radius:4px;overflow:hidden}
.sb-fill{display:flex;height:100%}
.sb-fill i{display:block;min-width:3px;border-right:2px solid #fff}
.sb-fill i:last-child{border-right:0}
.sb-v{color:var(--ink2);font-size:12.5px;min-width:90px;text-align:right;font-variant-numeric:tabular-nums}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:12px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.donut-w{display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.donut{width:150px;height:150px;flex:none}
.d-big{font-size:26px;font-weight:600;text-anchor:middle;fill:#242424}
.d-sub{font-size:9px;text-anchor:middle;fill:#616161}
.cols{display:flex;align-items:flex-end;gap:10px;height:170px;padding-top:8px}
.col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px;font-size:11.5px;color:var(--muted)}
.col .bar{width:100%;max-width:42px;background:var(--brand);border-radius:4px 4px 0 0;min-height:2px}
.col.cur .bar{background:#8FBDE8}
.col b{color:var(--ink);font-size:12px}
.attn{display:flex;flex-direction:column;gap:8px}
.attn a{display:flex;gap:12px;align-items:center;padding:10px 12px;border:1px solid var(--line2);border-radius:var(--r2);color:var(--ink)}
.attn a:hover{background:var(--brand-ll)}
.attn .ai{width:34px;height:34px;border-radius:8px;display:grid;place-items:center;background:var(--amber-l);color:var(--amber);flex:none}
.attn .ai.b{background:var(--brand-l);color:var(--brand)}
.attn b{display:block;font-weight:600}.attn small{color:var(--muted)}

/* Analysis */
.an-row{display:grid;grid-template-columns:minmax(150px,1.1fr) minmax(0,1.6fr) 64px 150px;gap:14px;align-items:center;width:100%;text-align:left;background:#fff;border:0;border-bottom:1px solid var(--line2);padding:11px 14px}
.an-row:hover{background:var(--brand-ll)}
.an-row.sel{background:var(--brand-l);box-shadow:inset 3px 0 0 var(--brand)}
.an-name b{display:block;font-weight:600}.an-name small{color:var(--muted);font-size:12px}
.an-bars{display:flex;flex-direction:column;gap:4px}
.bar-l{height:10px;border-radius:2px;position:relative;min-width:2px}
.bar-l.ref{background:#B7C4D1}.bar-l.real{background:var(--brand)}
.bar-l.real.flag{background:#C19C00}
.bar-l span{position:absolute;left:calc(100% + 6px);top:-4px;font-size:11px;color:var(--ink2);white-space:nowrap}
.an-num{font-weight:600;text-align:right;font-variant-numeric:tabular-nums}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px;margin:10px 0 6px}
.stat{background:#FAFAFA;border-radius:var(--r);padding:8px 10px}
.stat small{color:var(--muted);display:block;font-size:11.5px}.stat b{font-size:18px;font-weight:600}
.plot{width:100%;height:auto;display:block}
.plot text{font-size:10.5px;fill:#616161}
.causes{display:flex;flex-direction:column;gap:6px}
.cause{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border:1px solid var(--line2);border-radius:var(--r);font-size:13px}
.cause.hint{border-color:#F2DDA6;background:#FFFBF0}
.cause b{display:block;font-weight:600}.cause small{color:var(--muted)}

/* Board */
.board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;align-items:start}
.bcol{background:#EEF0F3;border-radius:var(--r2);padding:10px}
.bcol h3{font-size:13px;font-weight:600;display:flex;justify-content:space-between;margin:2px 4px 10px}
.kcard{background:#fff;border-radius:var(--r2);box-shadow:var(--sh);padding:12px;margin-bottom:10px;border-left:3px solid var(--brand)}
.kcard h4{font-size:13.5px;font-weight:600;margin-bottom:4px}
.kcard p{font-size:12.5px;color:var(--ink2);margin-bottom:6px}
.kcard .meta{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--muted);margin-top:8px;gap:6px;flex-wrap:wrap}
.kcard .resp{background:var(--brand-ll);border-radius:6px;padding:6px 8px;font-size:12px;margin-top:6px;color:var(--brand-dd)}
.bcol.c2 .kcard{border-left-color:#C19C00}.bcol.c3 .kcard{border-left-color:var(--green)}.bcol.c4 .kcard{border-left-color:#A9B4C0}
.idea{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid var(--line2);font-size:13px}
.idea:last-child{border-bottom:0}.idea .ic{color:var(--teal);margin-top:2px}

/* Timer */
.tm{text-align:center;padding:6px 0 4px}
.tm-name{font-weight:600;font-size:15px;color:var(--ink2)}
.tm-clock{font-size:56px;font-weight:600;letter-spacing:.02em;font-variant-numeric:tabular-nums;margin:6px 0 2px;color:var(--brand-dd)}
.tm-bar{height:6px;background:#E7ECF1;border-radius:3px;overflow:hidden;max-width:380px;margin:10px auto 6px}
.tm-bar i{display:block;height:100%;background:var(--brand);border-radius:3px;transition:width .3s}
.tm-ref{font-size:12.5px;color:var(--muted)}
.tm-btns{display:flex;gap:10px;justify-content:center;margin:16px 0 4px}
.tm-btns .btn{padding:9px 20px;font-size:14px}

/* Misc */
.toasts{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;z-index:100;align-items:center;pointer-events:none}
.toast{background:#323232;color:#fff;padding:10px 16px;border-radius:8px;box-shadow:var(--sh2);font-size:13.5px;animation:pop .2s ease-out;max-width:90vw}
@keyframes pop{from{transform:translateY(10px);opacity:0}}
.sumbar{display:flex;gap:18px;flex-wrap:wrap;font-size:13px;color:var(--ink2);margin-bottom:10px}
.hr{height:1px;background:var(--line2);margin:14px 0}
details.dt summary{cursor:pointer;font-weight:600;color:var(--brand-d);margin:8px 0}
.how{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.how div{background:var(--brand-ll);border-radius:var(--r2);padding:12px;font-size:13px}
.how b{display:block;margin-bottom:2px;color:var(--brand-dd)}
ol.roteiro{margin:6px 0 0 18px;padding:0;font-size:13.5px;display:flex;flex-direction:column;gap:3px}

/* Responsivo */
@media (max-width:1100px){
  .g-ms,.g-sm,.g2{grid-template-columns:1fr}
  .board{grid-template-columns:repeat(2,minmax(0,1fr))}
  .cycle{grid-template-columns:repeat(3,1fr)}
  .cycle a{border-bottom:1px solid var(--line2)}
  .top-search{display:none}
}
@media (max-width:900px){
  .burger{display:inline-grid}
  .sidebar{position:fixed;top:48px;bottom:0;left:0;z-index:35;transform:translateX(-100%);transition:transform .2s;box-shadow:var(--sh2)}
  body.nav-open .sidebar{transform:none}
  .main{padding:18px 14px 48px}
  .pill,.brand small,.who div{display:none}
  .act{grid-template-columns:1fr}
  .act-btns{justify-content:flex-start;max-width:none}
  .pipe{grid-template-columns:repeat(2,1fr)}
  .an-row{grid-template-columns:1fr 60px;}
  .an-bars{grid-column:1/-1;order:3}
  .row2,.row3,.how{grid-template-columns:1fr}
  .sb-row{grid-template-columns:110px minmax(0,1fr)}
  .sb-v{grid-column:1/-1;text-align:left}
  .kv{grid-template-columns:1fr}
}
@media (max-width:600px){
  .board{grid-template-columns:1fr}
  .cycle{grid-template-columns:repeat(2,1fr)}
  .tm-clock{font-size:44px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* Complementos */
.sec-h{font-size:15px;font-weight:600;margin:0 0 10px}
.cal-times{padding-top:0}
.cal-times div:first-child{transform:none}
.step-row{display:flex;gap:8px;align-items:flex-start;margin-bottom:8px}
.step-row .n{width:24px;height:24px;border-radius:50%;background:var(--brand-l);color:var(--brand-d);display:grid;place-items:center;font-weight:600;font-size:12px;flex:none;margin-top:6px}
.step-row .grow{flex:1;display:flex;flex-direction:column;gap:4px;min-width:0}
.step-row .row-acts{flex:none;flex-wrap:nowrap}
.icon-btn:hover{background:rgba(0,0,0,.07)}
.topbar .icon-btn:hover{background:rgba(255,255,255,.15)}

.plot-leg{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin:6px 0 2px}.plot-leg i{display:inline-block;width:16px;height:0;border-top:2px solid;vertical-align:middle;margin-right:5px}

.kcard .badge{white-space:normal;max-width:100%}
.topbar{overflow:hidden}.top-r{min-width:0}
@media (max-width:900px){.cal-in{min-width:640px}}
@media (max-width:640px){
  .tpill .n{display:none}.seg button{padding:5px 8px;font-size:12px}.top-r{gap:6px}.topbar{gap:8px;padding:0 8px}
}
@media (max-width:480px){.brand-name{display:none}}

'use strict';
/* Trabalho Padrão — dados fictícios de demonstração.
   Nenhuma informação real: pessoas, tempos e registros são simulados. */

const D = {
  pad: n => String(n).padStart(2, '0'),
  iso(d) { return d.getFullYear() + '-' + D.pad(d.getMonth() + 1) + '-' + D.pad(d.getDate()); },
  parse(s) { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); },
  add(s, n) { const d = D.parse(s); d.setDate(d.getDate() + n); return D.iso(d); },
  today() {
    const d = new Date();
    if (d.getDay() === 6) d.setDate(d.getDate() + 2);
    if (d.getDay() === 0) d.setDate(d.getDate() + 1);
    return D.iso(d);
  },
  monday(s) { const d = D.parse(s); d.setDate(d.getDate() - ((d.getDay() + 6) % 7)); return D.iso(d); }
};

const PEOPLE = {

/* ---------- Regras de recorrência (compartilhadas) ---------- */
function monthlyHit(a, d) {
  for (const off of [0, -1]) {
    const nom = new Date(d.getFullYear(), d.getMonth() + off, a.dom);
    if (nom.getDate() !== a.dom) continue;
    const sh = new Date(nom);
    if (nom.getDay() === 6) sh.setDate(sh.getDate() + 2);
    else if (nom.getDay() === 0) sh.setDate(sh.getDate() + 1);
    if (D.iso(sh) === D.iso(d)) return true;
  }
  return false;
}
function occursOn(a, date) {
  if (a.ended || date < a.start) return false;
  const d = D.parse(date), wd = d.getDay();
  if (wd === 0 || wd === 6) return false;
  switch (a.frequency) {
    case 'Diária': return true;
    case 'Semanal': return wd === a.wd;
    case 'Mensal': return monthlyHit(a, d);
    case 'Pontual': return date === a.start;
  }
  return false;
}

function mulberry32(seed) {
  return function () {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

/* ============================== Dados derivados ============================== */
const proc = id => S.procedures.find(p => p.id === id);
const act = id => S.activities.find(a => a.id === id);
const isPub = p => !!p && p.status === 'Publicado';
const isOld = p => daysAgo(p.updated) > 180;
const hasStd = a => isPub(a.procId ? proc(a.procId) : null);
const catOf = a => hasStd(a) ? proc(a.procId).category : 'Sem padrão';
const byTime = (a, b) => a.time.localeCompare(b.time);
const distinctNames = () => [...new Set(S.activities.map(a => a.name))].sort((a, b) => a.localeCompare(b, 'pt-BR'));
const ST_KIND = { 'Planejada': 'blue', 'Em andamento': 'teal', 'Concluída': 'green', 'Sem registro': 'gray', 'Parcial': 'amber', 'Interrompida': 'gray' };
const ST_CLS = { 'Planejada': '', 'Em andamento': 's-run', 'Concluída': 's-done', 'Sem registro': 's-none', 'Parcial': 's-part', 'Interrompida': 's-stop' };

function mk(a, orig, date, time) { return { id: a.id + '@' + orig, a, orig, date, time }; }
function instancesBetween(from, to, flt) {
  const out = [];
  for (const a of S.activities) {
    if (a.ended || (flt && !flt(a))) continue;
    for (let d = from; d <= to; d = D.add(d, 1)) if (occursOn(a, d) && !(a.moved && a.moved[d])) out.push(mk(a, d, d, a.time));
    for (const k in (a.moved || {})) { const m = a.moved[k]; if (m.date >= from && m.date <= to) out.push(mk(a, k, m.date, m.time)); }
  }
  return out;
}
function getInst(id) {
  const [aid, orig] = String(id).split('@'); const a = act(aid); if (!a) return null;
  const m = a.moved && a.moved[orig];
  return mk(a, orig, m ? m.date : orig, m ? m.time : a.time);
}
function instStatus(i) {
  if (S.timer && S.timer.instId === i.id) return 'Em andamento';
  const e = IDX[i.id]; if (e) return e.status;
  return i.date < TODAY ? 'Sem registro' : 'Planejada';
}
function daySummary(list) {
  const st = list.map(instStatus);
  return { plan: list.length, done: st.filter(s => s === 'Concluída').length, run: st.filter(s => s === 'Em andamento').length, ref: list.reduce((s, i) => s + (i.a.refMin || 0), 0) };
}
const elapsedMs = () => S.timer ? S.timer.acc + (S.timer.running ? Date.now() - S.timer.since : 0) : 0;

function analysis(per) {
  const from = per === '4' ? D.add(TODAY, -28) : per === '8' ? D.add(TODAY, -56) : '0000-00-00';
  const g = {};
  for (const e of S.executions) { if (e.status !== 'Concluída' || e.date < from) continue; (g[e.name] = g[e.name] || []).push(e); }
  return Object.entries(g).map(([name, list]) => {
    const a = S.activities.find(x => x.name === name);
    const ref = a ? a.refMin : list[0].refMin;
    const v = list.map(e => e.realMin), n = v.length, mean = v.reduce((s, x) => s + x, 0) / n;
    const sd = Math.sqrt(v.reduce((s, x) => s + (x - mean) ** 2, 0) / n);
    const diff = ref ? (mean - ref) / ref * 100 : null;
    const p = a && a.procId ? proc(a.procId) : null;
    list.sort((x, y) => x.date.localeCompare(y.date));
    return { name, procId: a ? a.procId : null, cat: a ? catOf(a) : 'Sem padrão', n, ref, mean, sd, min: Math.min(...v), max: Math.max(...v), diff,
      flag: !!(ref && n >= 4 && Math.abs(diff) >= 20), small: n < 4, list, old: !!(p && isOld(p)), std: !!(a && hasStd(a)) };
  });
}

const head = (eyebrow, title, sub, right = '') => `<div class="phead"><div><div class="eyebrow">${eyebrow}</div><h1>${title}</h1>${sub ? `<p>${sub}</p>` : ''}</div><div class="phead-r">${right}</div></div>`;
const card = (title, body, right = '', cls = '') => `<section class="card ${cls}"><div class="card-h"><h2>${title}</h2>${right}</div><div class="card-b">${body}</div></section>`;
const empty = (icon, t, p, btn = '') => `<div class="empty">${ic(icon, 34)}<h3>${t}</h3><p>${p}</p>${btn ? `<div style="margin-top:12px">${btn}</div>` : ''}</div>`;

function stackBars(rows, fmt = v => num(v, 0)) {
  const max = Math.max(...rows.map(r => r.segs.reduce((s, x) => s + x.v, 0)), 1);
  return `<div class="sbars">${rows.map(r => {
    const tot = r.segs.reduce((s, x) => s + x.v, 0);
    return `<div class="sb-row"><div class="sb-l">${r.label}</div><div class="sb-track"><div class="sb-fill" style="width:${tot / max * 100}%">${r.segs.filter(x => x.v > 0).map(x => `<i style="flex:${x.v};background:${x.c}" title="${esc(x.t)}: ${fmt(x.v)}"></i>`).join('')}</div></div><div class="sb-v">${r.val != null ? r.val : fmt(tot)}</div></div>`;
  }).join('')}</div>`;
}
function donut(parts, big, sub) {
  const R = 54, C = 2 * Math.PI * R, tot = parts.reduce((s, p) => s + p.v, 0) || 1; let off = 0;
  return `<svg viewBox="0 0 140 140" class="donut" role="img" aria-label="${esc(big + ' ' + sub)}"><circle cx="70" cy="70" r="${R}" fill="none" stroke="#EEF0F3" stroke-width="18"/>${parts.map(p => {
    const len = p.v / tot * C; const s = `<circle cx="70" cy="70" r="${R}" fill="none" stroke="${p.c}" stroke-width="18" stroke-dasharray="${len} ${C - len}" stroke-dashoffset="${-off}" transform="rotate(-90 70 70)"><title>${esc(p.t)}: ${p.v}</title></circle>`; off += len; return s;
  }).join('')}<text x="70" y="70" class="d-big">${big}</text><text x="70" y="86" class="d-sub">${sub}</text></svg>`;
}
function dotPlot(list, ref, mean) {
  const W = 420, Hh = 210, L = 32, R = 10, T = 10, B = 26;
  const pts = list.slice(-40), vals = pts.map(e => e.realMin);
  const max = Math.max(...vals, ref || 0, mean) * 1.15;
  const x = i => L + (pts.length <= 1 ? (W - L - R) / 2 : i * (W - L - R) / (pts.length - 1));
  const y = v => T + (1 - v / max) * (Hh - T - B);
  const ticks = [0, .25, .5, .75, 1].map(t => Math.round(max * t));
  return `<div class="plot-leg"><span style="color:#115EA3"><i></i>Média ${num(mean, 1)} min</span>${ref ? `<span style="color:#0E7C86"><i style="border-top-style:dashed"></i>Referência ${ref} min</span>` : ''}<span><b style="color:#0F6CBD">●</b> Execuções (últimas ${Math.min(list.length, 40)})</span></div><svg class="plot" viewBox="0 0 ${W} ${Hh}" role="img" aria-label="Tempos reais registrados em comparação com o tempo de referência">
    ${ticks.map(t => `<line x1="${L}" x2="${W - R}" y1="${y(t)}" y2="${y(t)}" stroke="#EEF0F3"/><text x="${L - 6}" y="${y(t) + 3}" text-anchor="end">${t}</text>`).join('')}
    ${ref ? `<line x1="${L}" x2="${W - R}" y1="${y(ref)}" y2="${y(ref)}" stroke="#0E7C86" stroke-width="1.5" stroke-dasharray="5 4"/>` : ''}
    <line x1="${L}" x2="${W - R}" y1="${y(mean)}" y2="${y(mean)}" stroke="#115EA3" stroke-width="1.5"/>
    ${pts.map((e, i) => `<circle cx="${x(i)}" cy="${y(e.realMin)}" r="4" fill="#0F6CBD" fill-opacity=".75"><title>${fmtDate(e.date)} · ${e.realMin} min</title></circle>`).join('')}
    <text x="${L}" y="${Hh - 8}">${pts.length ? fmtDate(pts[0].date) : ''}</text><text x="${W - R}" y="${Hh - 8}" text-anchor="end">${pts.length ? fmtDate(pts[pts.length - 1].date) : ''}</text>
  </svg>`;
}

  const insts = instancesBetween(mon, fri, a => a.userId === ME.c);
  const list = insts.filter(i => i.date === day).sort(byTime);
  const sm = daySummary(list), isToday = day === TODAY;
  const dm = D.parse(mon), df = D.parse(fri);
  const range = `${D.pad(dm.getDate())} ${MON[dm.getMonth()]} – ${D.pad(df.getDate())} ${MON[df.getMonth()]} ${df.getFullYear()}`;
  return head('Minha rotina', 'Olá, Ana!', 'Organize suas atividades e encontre as orientações necessárias para executar seu trabalho.',

    <div class="kpis">
      <div class="kpi"><div class="kpi-l">Atividades planejadas</div><div class="kpi-v">${sm.plan}</div></div>
      <div class="kpi g"><div class="kpi-l">Atividades concluídas</div><div class="kpi-v">${sm.done}</div></div>

      `<small>${list.length} atividade${list.length === 1 ? '' : 's'} · clique em um dia do calendário para trocar</small>`, 'mt');
}

function calendar(insts) {
  const days = [0, 1, 2, 3, 4].map(i => D.add(UI.mon, i));
  let h0 = 8, h1 = 18;
  for (const i of insts) { const s = toMin(i.time); h0 = Math.min(h0, Math.floor(s / 60)); h1 = Math.max(h1, Math.ceil((s + Math.max(i.a.refMin || 30, 25)) / 60)); }
  const ROW = 68, H = (h1 - h0) * ROW, nd = new Date(), nowMin = nd.getHours() * 60 + nd.getMinutes();
  const headH = days.map(d => { const dt = D.parse(d); return `<button class="cal-day ${d === TODAY ? 'today' : ''} ${d === UI.day ? 'sel' : ''}" data-act="selDay" data-d="${d}" aria-label="${fmtShort(d)}">${WD[dt.getDay()]}<b>${D.pad(dt.getDate())}</b></button>`; }).join('');
  const cols = days.map(d => {
    const items = insts.filter(i => i.date === d).sort(byTime).map(i => ({ i, s: toMin(i.time), e: toMin(i.time) + Math.max(i.a.refMin || 30, 25) }));
    const ends = []; items.forEach(it => { let l = 0; while (ends[l] !== undefined && ends[l] > it.s) l++; ends[l] = it.e; it.l = l; });
    items.forEach(it => { it.n = 1 + Math.max(...items.filter(x => x.s < it.e && x.e > it.s).map(x => x.l)); });
    const evs = items.map(it => {
      const st = instStatus(it.i), a = it.i.a, top = (it.s - h0 * 60) / 60 * ROW, hh = Math.max((it.e - it.s) / 60 * ROW - 2, 34);
      return `<button class="ev ${ST_CLS[st]} ${hasStd(a) ? '' : 'nostd'}" style="top:${top}px;height:${hh}px;left:calc(${it.l / it.n * 100}% + 2px);width:calc(${100 / it.n}% - 4px)" data-act="detail" data-inst="${it.i.id}" title="${esc(a.name)} · ${it.i.time} · ${st}"><b>${esc(a.name)}</b><span>${it.i.time} · ${fmtMin(a.refMin)}</span></button>`;
    }).join('');
    const now = (d === TODAY && nowMin >= h0 * 60 && nowMin < h1 * 60) ? `<div class="now" style="top:${(nowMin - h0 * 60) / 60 * ROW}px"></div>` : '';
    return `<div class="cal-col ${d === TODAY ? 'today' : ''} ${d === UI.day ? 'sel' : ''}" style="height:${H}px;background-size:100% ${ROW}px">${evs}${now}</div>`;
  }).join('');
  const times = Array.from({ length: h1 - h0 }, (_, k) => `<div style="height:${ROW}px">${D.pad(h0 + k)}:00</div>`).join('');
  return `<div class="cal"><div class="cal-in"><div class="cal-head"><div></div>${headH}</div><div class="cal-body"><div class="cal-times">${times}</div>${cols}</div></div></div>`;
}

function pgProcs() {

        <td>${badge(p.category, 'blue-o')}</td><td>${person(p.owner)}</td><td>${p.frequency}</td><td>${fmtDate(p.updated)}<br><small style="color:var(--muted)">${rel(p.updated)} · v${p.version}</small></td></tr>`).join('')}</tbody></table></div>`
        : empty('search', 'Nenhum procedimento encontrado', 'Tente outro termo ou limpe o filtro de categoria.'));
}

function pgEquipe() {
  const names = distinctNames(), withStd = names.filter(n => S.activities.some(a => a.name === n && hasStd(a)));
  const mon = D.monday(TODAY), fri = D.add(mon, 4), wk = instancesBetween(mon, fri);
  const wkMin = wk.reduce((s, i) => s + (i.a.refMin || 0), 0);
  const pubs = S.procedures.filter(isPub).length, an = analysis('all'), flagged = an.filter(x => x.flag);
  const old = S.procedures.filter(p => isPub(p) && isOld(p)), openS = S.suggestions.filter(s => s.status === 'Nova' || s.status === 'Em análise').length;
  const newS = S.suggestions.filter(s => s.status === 'Nova').length;
  const e28 = S.executions.filter(e => e.date >= D.add(TODAY, -28)).length, doneWk = S.executions.filter(e => e.date >= mon && e.date <= fri && e.status === 'Concluída').length;
  const noStd = names.length - withStd.length;
  const rows = TEAM.map(u => {
    const mine = S.activities.filter(a => a.userId === u), w = mine.filter(hasStd).length, min = wk.filter(i => i.a.userId === u).reduce((s, i) => s + (i.a.refMin || 0), 0);
    return { label: `${avatar(u, 22)}${esc(PEOPLE[u].name)}`, segs: [{ v: w, c: '#0F6CBD', t: 'Com Trabalho Padrão' }, { v: mine.length - w, c: '#A9B4C0', t: 'Sem Trabalho Padrão' }], val: `${mine.length} atividades · ${fmtMin(min)}/sem` };
  });
  const weeks = Array.from({ length: 8 }, (_, k) => { const m = D.add(mon, -7 * (7 - k)); return { m, n: S.executions.filter(e => e.date >= m && e.date <= D.add(m, 6)).length }; });
  const wmax = Math.max(...weeks.map(w => w.n), 1);
  const pipe = WORKFLOW.map(w => [w, S.procedures.filter(p => p.status === w).length]);
  return head('Gestor', 'Visão da equipe', 'Uma visão consolidada das atividades, responsabilidades e oportunidades de melhoria.') +
    `<nav class="cycle" aria-label="Ciclo do Trabalho Padrão">
      <a href="#/g/distribuicao"><i>1 · Organizar</i><b>${names.length}</b><span>atividades mapeadas</span></a>
      <a href="#/g/gestao"><i>2 · Consultar</i><b>${pubs}</b><span>padrões publicados</span></a>
      <a href="#/g/distribuicao"><i>3 · Executar</i><b>${doneWk}</b><span>concluídas nesta semana</span></a>
      <a href="#/g/analise"><i>4 · Registrar</i><b>${e28}</b><span>registros em 4 semanas</span></a>
      <a href="#/g/analise"><i>5 · Analisar</i><b>${flagged.length}</b><span>com diferença recorrente</span></a>
      <a href="#/g/melhorias"><i>6 · Melhorar</i><b>${openS}</b><span>sugestões em aberto</span></a></nav>
    <div class="kpis">
      <div class="kpi"><div class="kpi-l">Atividades mapeadas</div><div class="kpi-v">${names.length}</div><div class="kpi-s">processos distintos da equipe</div></div>
      <div class="kpi t"><div class="kpi-l">Procedimentos documentados</div><div class="kpi-v">${pubs}</div><div class="kpi-s">${S.procedures.length - pubs} em elaboração ou revisão</div></div>
      <div class="kpi a"><div class="kpi-l">Atividades sem procedimento</div><div class="kpi-v">${noStd}</div><div class="kpi-s">${num(withStd.length / names.length * 100, 0)}% já padronizadas</div></div>
      <div class="kpi s"><div class="kpi-l">Colaboradores</div><div class="kpi-v">${TEAM.length}</div><div class="kpi-s">na equipe de TI</div></div>
      <div class="kpi g"><div class="kpi-l">Tempo de referência planejado</div><div class="kpi-v">${fmtMin(wkMin)}</div><div class="kpi-s">na semana, soma da equipe</div></div></div>
    <div class="grid g-ms">
      ${card('Distribuição das atividades por colaborador', stackBars(rows) + `<div class="legend"><span><i style="background:#0F6CBD"></i>Com Trabalho Padrão</span><span><i style="background:#A9B4C0"></i>Sem Trabalho Padrão</span></div>`, `<a class="btn ghost sm" href="#/g/distribuicao">Ver detalhes</a>`)}
      ${card('Cobertura de Trabalho Padrão', `<div class="donut-w">${donut([{ v: withStd.length, c: '#0F6CBD', t: 'Com padrão publicado' }, { v: noStd, c: '#A9B4C0', t: 'Sem padrão' }], num(withStd.length / names.length * 100, 0) + '%', 'padronizadas')}
        <div class="legend" style="flex-direction:column;gap:8px;margin:0"><span><i style="background:#0F6CBD"></i><b>${withStd.length}</b> com procedimento publicado</span><span><i style="background:#A9B4C0"></i><b>${noStd}</b> sem procedimento cadastrado</span></div></div>`)}
    </div>
    <div class="grid g-ms mt">
      ${card('Registros de execução por semana', `<div class="cols">${weeks.map((w, k) => `<div class="col ${k === 7 ? 'cur' : ''}"><b>${w.n}</b><div class="bar" style="height:${w.n / wmax * 100}%"></div>${D.pad(D.parse(w.m).getDate())}/${D.pad(D.parse(w.m).getMonth() + 1)}</div>`).join('')}</div><small style="color:var(--muted)">Semana atual ainda em andamento (barra mais clara).</small>`)}
      ${card('Procedimentos por etapa de revisão', `<div class="pipe" style="grid-template-columns:repeat(2,1fr);margin:0">${pipe.map(([w, n]) => `<button data-act="gStatusGo" data-s="${w}"><b>${n}</b><span>${w}</span></button>`).join('')}</div>`)}
    </div>
    ${card('Pontos de atenção', `<div class="attn">
      <a href="#/g/gestao" data-act="gOldGo"><span class="ai">${ic('alert', 18)}</span><div><b>${old.length} procedimento${old.length === 1 ? '' : 's'} sem atualização há mais de 6 meses</b><small>${old.map(p => esc(p.name)).join(' · ') || 'Nenhum no momento'}</small></div></a>
      <a href="#/g/analise"><span class="ai">${ic('trend', 18)}</span><div><b>${flagged.length} atividade${flagged.length === 1 ? '' : 's'} com diferença recorrente em relação ao tempo de referência</b><small>Vale investigar o processo, não as pessoas: ${flagged.slice(0, 3).map(x => esc(x.name)).join(' · ')}${flagged.length > 3 ? '…' : ''}</small></div></a>
      <a href="#/g/melhorias"><span class="ai b">${ic('bulb', 18)}</span><div><b>${newS} sugest${newS === 1 ? 'ão nova' : 'ões novas'} aguardando análise</b><small>Registradas pelos colaboradores</small></div></a>
      <a href="#/g/distribuicao" data-act="dNoGo"><span class="ai b">${ic('file', 18)}</span><div><b>${noStd} atividades sem Trabalho Padrão cadastrado</b><small>Oportunidade de documentar o conhecimento da equipe</small></div></a></div>`, '', 'mt')}`;
}

const rangeOf = per => { const mon = D.monday(TODAY); return per === 'week' ? [mon, D.add(mon, 4)] : per === 'next' ? [D.add(mon, 7), D.add(mon, 11)] : [TODAY, D.add(TODAY, 29)]; };
function pgDistrib() {
  const f = UI.f, [from, to] = rangeOf(f.dPer), names = distinctNames();
  const acts = S.activities.filter(a => (!f.dUser || a.userId === f.dUser) && (!f.dAct || a.name === f.dAct) && (!f.dNo || !hasStd(a)))
    .sort((a, b) => TEAM.indexOf(a.userId) - TEAM.indexOf(b.userId) || a.time.localeCompare(b.time));
  const insts = instancesBetween(from, to), users = f.dUser ? [f.dUser] : TEAM, cats = new Set();
  const loadRows = users.map(u => {
    const by = {}; insts.filter(i => i.a.userId === u).forEach(i => { const c = catOf(i.a); by[c] = (by[c] || 0) + (i.a.refMin || 0); });
    Object.keys(by).forEach(c => cats.add(c));
    return { label: `${avatar(u, 22)}${esc(PEOPLE[u].name)}`, segs: Object.entries(by).map(([c, v]) => ({ v: v / 60, c: CAT_COLOR[c], t: c })), val: fmtMin(Object.values(by).reduce((s, x) => s + x, 0)) };
  });
  const occ = a => insts.filter(i => i.a.id === a.id).length, total = acts.reduce((s, a) => s + occ(a) * (a.refMin || 0), 0);
  return head('Gestor', 'Distribuição das atividades', 'Veja como o trabalho está distribuído para apoiar conversas sobre equilíbrio e redistribuição. Não há ranking de pessoas.',
      `<button class="btn primary" data-act="actNew">${ic('plus', 16)} Adicionar atividade à agenda</button>`) +
    `<div class="filters">
      <div class="field"><label for="dUser">Colaborador</label><select id="dUser" data-filter="dUser"><option value="">Todos</option>${TEAM.map(u => `<option value="${u}" ${f.dUser === u ? 'selected' : ''}>${PEOPLE[u].name}</option>`).join('')}</select></div>
      <div class="field"><label for="dAct">Atividade</label><select id="dAct" data-filter="dAct"><option value="">Todas</option>${names.map(n => `<option ${f.dAct === n ? 'selected' : ''}>${esc(n)}</option>`).join('')}</select></div>
      <div class="field"><label for="dPer">Período</label><select id="dPer" data-filter="dPer"><option value="week" ${f.dPer === 'week' ? 'selected' : ''}>Esta semana</option><option value="next" ${f.dPer === 'next' ? 'selected' : ''}>Próxima semana</option><option value="m30" ${f.dPer === 'm30' ? 'selected' : ''}>Próximos 30 dias</option></select></div>
      <label class="chk" style="padding-bottom:8px"><input type="checkbox" data-filter="dNo" ${f.dNo ? 'checked' : ''}> Somente sem padrão</label></div>` +
    card(`Carga de trabalho planejada · ${fmtDate(from)} a ${fmtDate(to)}`, stackBars(loadRows, v => num(v, 1) + ' h') +
      `<div class="legend">${[...cats].map(c => `<span><i style="background:${CAT_COLOR[c]}"></i>${c}</span>`).join('')}</div><p style="color:var(--muted);font-size:12.5px;margin-top:10px">Soma dos tempos de referência das ocorrências planejadas. Serve para enxergar a distribuição, não para medir desempenho.</p>`) +
    card(`Atividades da equipe (${acts.length})`, acts.length ? `<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Colaborador</th><th>Atividade</th><th>Frequência</th><th class="num">Tempo de referência</th><th class="num">Ocorrências</th><th>Responsável pelo processo</th><th>Status</th><th></th></tr></thead><tbody>${acts.map(a => {
      const p = a.procId ? proc(a.procId) : null, std = isPub(p);
      return `<tr><td>${person(a.userId)}</td><td><b>${esc(a.name)}</b><br><small style="color:var(--muted)">${a.frequency} · ${a.time}</small></td><td>${a.frequency}</td><td class="num">${fmtMin(a.refMin)}</td><td class="num">${occ(a)}</td>
        <td>${std ? person(p.owner) : '<span style="color:var(--muted)">—</span>'}</td><td>${std ? badge('Com padrão', 'blue-o') : badge('Sem padrão', 'dashed')} ${std && isOld(p) ? badge('Desatualizado', 'amber') : ''}</td>
        <td><div class="row-acts">${std ? `<button class="btn sm" data-act="std" data-p="${p.id}">${ic('book', 14)} Padrão</button>` : `<button class="btn sm primary" data-act="assoc" data-name="${esc(a.name)}">Associar padrão</button>`}
        <button class="btn sm" data-act="actEdit" data-id="${a.id}">${ic('edit', 14)} Editar</button><button class="btn sm" data-act="hist" data-id="${a.id}">${ic('history', 14)} Histórico</button></div></td></tr>`;
    }).join('')}</tbody><tfoot><tr><td colspan="3">Tempo planejado no período</td><td class="num" colspan="2">${fmtMin(total)}</td><td colspan="3"></td></tr></tfoot></table></div>` : empty('search', 'Nenhuma atividade com esses filtros', 'Ajuste os filtros acima.'), '', 'mt');
}

function pgAnalise() {
  const per = UI.f.anPer, an = analysis(per).sort((a, b) => (b.flag - a.flag) || (Math.abs(b.diff || 0) - Math.abs(a.diff || 0)));
  const sel = an.find(x => x.name === UI.an) || an.find(x => x.name === 'Verificação de chamados') || an[0];
  UI.an = sel && sel.name;
  const max = Math.max(...an.map(x => Math.max(x.ref || 0, x.mean)), 1), flagged = an.filter(x => x.flag).length;
  const row = x => `<button class="an-row ${sel && x.name === sel.name ? 'sel' : ''}" data-act="anSel" data-n="${esc(x.name)}">
    <div class="an-name"><b>${esc(x.name)}</b><small>${x.std ? 'Com padrão' : 'Sem padrão'} · ${x.n} execuções</small></div>
    <div class="an-bars"><div class="bar-l ref" style="width:${(x.ref || 0) / max * 85}%"><span>ref. ${x.ref || '—'}</span></div><div class="bar-l real ${x.flag ? 'flag' : ''}" style="width:${x.mean / max * 85}%"><span>${num(x.mean, 1)}</span></div></div>
    <div class="an-num">${x.diff == null ? '—' : (x.diff > 0 ? '+' : '') + num(x.diff, 0) + '%'}</div>
    <div>${x.flag ? badge('Diferença recorrente', 'amber') : x.small ? badge('Poucos registros', 'gray') : badge('Próxima da referência', 'green')}</div></button>`;
  const causes = s => {
    const cv = s.sd / s.mean;
    return [
      ['Procedimento que precisa ser atualizado', 'As etapas ainda refletem o ambiente atual?', s.old],
      ['Etapas desnecessárias', 'Há passos repetidos ou que poderiam ser combinados?', s.flag && s.diff > 0],
      ['Complexidade não prevista', 'Os tempos variam muito de uma execução para outra?', cv > .15],
      ['Necessidade de capacitação', 'Quem executa tem material e apoio suficientes?', false],
      ['Oportunidade de automação', 'Parte da atividade é manual e repetitiva?', s.flag && s.diff > 0 && s.n >= 20],
      ['Tempo de referência inadequado', s.std ? 'A referência foi definida com base na prática atual?' : 'Ainda não há padrão: a referência pode ser apenas estimada.', s.flag || !s.std]
    ];
  };
  return head('Gestor', 'Análise dos processos', 'Compare o tempo de referência com os tempos reais registrados para investigar causas nos processos, nunca para julgar pessoas.') +
    `<div class="note">${ic('info', 18)}<div>Os números abaixo reúnem os registros de toda a equipe por atividade, sem identificar quem executou. Uma diferença não é, por si só, um problema de desempenho. Ela indica onde vale investigar o processo. Considera apenas execuções concluídas.</div></div>
    <div class="filters mt"><div class="field"><label for="anPer">Período dos registros</label><select id="anPer" data-filter="anPer"><option value="4" ${per === '4' ? 'selected' : ''}>Últimas 4 semanas</option><option value="8" ${per === '8' ? 'selected' : ''}>Últimas 8 semanas</option><option value="all" ${per === 'all' ? 'selected' : ''}>Todo o histórico</option></select></div>
      <div class="chips" style="padding-bottom:8px">${badge(an.length + ' atividades analisadas', 'blue-o')}${badge(flagged + ' com diferença recorrente', 'amber')}${badge(an.reduce((s, x) => s + x.n, 0) + ' execuções', 'outline')}</div></div>
    <div class="grid g-ms">
      ${card('Tempo de referência × tempo real médio (min)', `<div class="legend" style="margin:0 0 6px"><span><i style="background:#B7C4D1"></i>Tempo de referência</span><span><i style="background:#0F6CBD"></i>Média dos tempos reais</span><span><i style="background:#C19C00"></i>Diferença recorrente (±20% com 4+ registros)</span></div><div style="margin:0 -16px -16px">${an.map(row).join('') || empty('trend', 'Sem registros no período', 'Registre execuções para ver a comparação.')}</div>`)}
      ${sel ? card(esc(sel.name), `<div class="chips">${sel.flag ? badge('Diferença recorrente', 'amber') : badge('Dentro do esperado', 'green')}${badge(sel.cat, 'outline')}</div>
        <div class="stats"><div class="stat"><small>Referência</small><b>${sel.ref ? sel.ref + ' min' : '—'}</b></div><div class="stat"><small>Média real</small><b>${num(sel.mean, 1)} min</b></div><div class="stat"><small>Variação (desvio)</small><b>± ${num(sel.sd, 1)}</b></div><div class="stat"><small>Mín. – Máx.</small><b>${sel.min}–${sel.max}</b></div><div class="stat"><small>Execuções</small><b>${sel.n}</b></div></div>

    <div class="filters"><div class="sbox">${ic('search', 16)}<input type="search" data-filter="gQ" value="${esc(f.gQ)}" placeholder="Pesquisar procedimentos" aria-label="Pesquisar procedimentos"></div>
      <div class="field"><label for="gOwner">Responsável</label><select id="gOwner" data-filter="gOwner"><option value="">Todos</option>${TEAM.map(u => `<option value="${u}" ${f.gOwner === u ? 'selected' : ''}>${PEOPLE[u].name}</option>`).join('')}</select></div>
      <label class="chk" style="padding-bottom:8px"><input type="checkbox" data-filter="gOld" ${f.gOld ? 'checked' : ''}> Desatualizados (6+ meses)</label>
      ${(f.gStatus || f.gOwner || f.gOld || f.gQ) ? `<button class="btn ghost sm" data-act="gClear">Limpar filtros</button>` : ''}</div>` +
    card(`${list.length} procedimento${list.length === 1 ? '' : 's'}`, list.length ? `<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Procedimento</th><th>Responsável</th><th>Capacitados</th><th>Frequência</th><th>Versão · atualização</th><th>Situação</th><th></th></tr></thead><tbody>${list.map(p => `
      <tr class="click" data-act="std" data-p="${p.id}"><td><div class="cell-name"><span class="fileic">${ic('file', 17)}</span><div><b>${esc(p.name)}</b><small>${p.category}</small></div></div></td>

      <td>${badge(p.status, { 'Rascunho': 'gray', 'Em revisão': 'amber', 'Aprovado': 'teal', 'Publicado': 'blue' }[p.status])} ${isPub(p) && isOld(p) ? badge('Desatualizado', 'amber') : ''}</td>
      <td><div class="row-acts"><button class="btn sm" data-act="procEdit" data-id="${p.id}">${ic('edit', 14)} Editar</button></div></td></tr>`).join('')}</tbody></table></div>` : empty('search', 'Nenhum procedimento com esses filtros', 'Limpe os filtros para ver todos.'));
}

function pgMelhorias() {
  const act0 = UI.f.melAct, all = S.suggestions.filter(s => !act0 || s.activity === act0).sort((a, b) => b.date.localeCompare(a.date));
  const ideas = [['Avisar o responsável quando uma nova sugestão for registrada', 'Notificação automática para a gestão'], ['Lembrar a revisão de procedimentos com mais de 6 meses', 'Alerta periódico ao responsável pelo processo'], ['Registrar automaticamente a abertura da fila de chamados', 'Reduz o registro manual de início da atividade']];
  return head('Gestor', 'Oportunidades de melhoria', 'Sugestões registradas pelos colaboradores. A análise da gestão decide o que vira revisão do padrão oficial.') +
    `<div class="note">${ic('info', 18)}<div>Uma sugestão aprovada <b>não altera o procedimento automaticamente</b>. Ela alimenta a revisão do padrão, que segue o fluxo Rascunho → Em revisão → Aprovado → Publicado.</div></div>
    ${act0 ? `<div class="chips mt">${badge('Filtro: ' + act0, 'blue-o')}<button class="btn ghost sm" data-act="melClear">Limpar filtro</button></div>` : ''}

    ${card('Ideias de automação (conceito)', `<p style="color:var(--muted);font-size:12.5px;margin-bottom:6px">Exemplos do que poderia ser automatizado em um ambiente Microsoft 365 com Power Automate. Nada disso existe neste protótipo.</p>${ideas.map(([t, s]) => `<div class="idea">${ic('bolt', 16)}<div><b>${t}</b><br><small style="color:var(--muted)">${s}</small></div></div>`).join('')}`, badge('Conceito · não implementado', 'dashed'), 'mt')}`;

/* ============================== Painel lateral: Trabalho Padrão ============================== */
function renderDrawer() {

}
function drawerHtml(d) {
  const mgr = UI.p === 'g', close = `<button class="icon-btn" data-act="closeDrawer" aria-label="Fechar painel">${ic('x', 20)}</button>`;
  const p = d.procId ? proc(d.procId) : null;

    const i = d.instId ? getInst(d.instId) : null, nm = d.name || (i && i.a.name) || 'Atividade';
    return `<div class="dr-h"><div class="row"><div>${badge('Sem Trabalho Padrão cadastrado', 'dashed')}<h2>${esc(nm)}</h2></div>${close}</div></div>
      <div class="dr-b">${empty('file', 'Sem Trabalho Padrão cadastrado', 'Esta atividade ainda não tem um procedimento documentado. Você pode executá-la e registrar o tempo normalmente.',
        mgr ? `<div class="chips" style="justify-content:center"><button class="btn primary" data-act="procNew" data-name="${esc(nm)}">Cadastrar procedimento</button><button class="btn" data-act="assoc" data-name="${esc(nm)}">Associar existente</button></div>`

  }

  const next = ['Enviar para revisão', 'Aprovar', 'Publicar'][idx], back = [null, 'Voltar para rascunho', 'Devolver para revisão', 'Despublicar'][idx];

    ? `<div class="sec-t">Histórico de alterações</div><ul class="mini-list">${p.history.map(h => `<li><span>${ic('history', 14)} ${esc(h.note)}</span><span style="color:var(--muted);white-space:nowrap">${fmtDate(h.date)} · ${esc(PEOPLE[h.who].short)}</span></li>`).join('')}</ul>`
    : `${mgr ? `<div class="sec-t">Fluxo de revisão</div>${flowSteps(p.status)}<div class="chips" style="margin-top:10px">${back ? `<button class="btn sm" data-act="procFlow" data-id="${p.id}" data-dir="-1">${back}</button>` : ''}${next ? `<button class="btn sm primary" data-act="procFlow" data-id="${p.id}" data-dir="1">${next}</button>` : ''}</div>
        ${!isPub(p) ? `<div class="note warn" style="margin-top:10px">${ic('alert', 16)}<div>Ainda não publicado: colaboradores não visualizam este procedimento.</div></div>` : ''}${isPub(p) && isOld(p) ? `<div class="note warn" style="margin-top:10px">${ic('alert', 16)}<div>Sem atualização há ${daysAgo(p.updated)} dias. Considere uma revisão.</div></div>` : ''}` : ''}
      <div class="sec-t">Identificação</div>
      <dl class="kv"><dt>Descrição</dt><dd>${esc(p.description)}</dd><dt>Objetivo</dt><dd>${esc(p.objective)}</dd><dt>Frequência</dt><dd>${p.frequency}</dd><dt>Tempo de referência</dt><dd>${fmtMin(p.refMin)}</dd></dl>
      <div class="sec-t">Responsabilidades</div>
      <dl class="kv"><dt>Responsável pelo processo</dt><dd>${person(p.owner)}</dd><dt>Pessoas capacitadas</dt><dd class="chips">${p.capable.map(person).join('') || '—'}</dd></dl>
      <div class="sec-t">Procedimento</div>
      <ol class="steps">${p.steps.map((s, i) => `<li class="step ${st[i] ? 'ok' : ''}"><label><input type="checkbox" data-stepchk="${i}" ${st[i] ? 'checked' : ''}><span class="n">${i + 1}</span><span><b>${esc(s.t)}</b>${s.d ? `<p>${esc(s.d)}</p>` : ''}</span></label></li>`).join('')}</ol>
      <div class="sec-t">Recursos necessários</div>
      <p class="lbl" style="margin-bottom:6px">Sistemas utilizados</p><div class="chips">${p.systems.map(s => badge(s, 'blue-o')).join('') || '<span style="color:var(--muted)">—</span>'}</div>
      <p class="lbl" style="margin:12px 0 6px">Documentos relacionados</p><div class="res-list">${p.docs.map((x, i) => docBtn(p, 'docs', i, x)).join('') || '<span style="color:var(--muted)">—</span>'}</div>
      <p class="lbl" style="margin:12px 0 6px">Materiais de apoio</p><div class="res-list">${p.materials.map((x, i) => docBtn(p, 'materials', i, x)).join('') || '<span style="color:var(--muted)">—</span>'}</div>`;
  return `<div class="dr-h"><div class="row"><div><div class="chips">${badge(p.category, 'blue-o')}${mgr ? badge(p.status, { 'Rascunho': 'gray', 'Em revisão': 'amber', 'Aprovado': 'teal', 'Publicado': 'blue' }[p.status]) : ''}</div><h2>${esc(p.name)}</h2>
      <small style="color:var(--muted)">Versão ${p.version} · atualizado em ${fmtDate(p.updated)}</small></div><div style="display:flex;gap:4px">${mgr ? `<button class="btn sm" data-act="procEdit" data-id="${p.id}">${ic('edit', 14)} Editar</button>` : ''}${close}</div></div>
    ${mgr ? `<div class="tabs"><button class="${tab === 'std' ? 'on' : ''}" data-act="drTab" data-t="std">Trabalho Padrão</button><button class="${tab === 'hist' ? 'on' : ''}" data-act="drTab" data-t="hist">Histórico de alterações</button></div>` : ''}</div>
    <div class="dr-b">${body}</div>`;
}
const docBtn = (p, k, i, x) => `<button class="doc" data-act="doc" data-p="${p.id}" data-k="${k}" data-i="${i}"><span class="fileic">${ic(fileIc(x.t), 16)}</span><span style="flex:1"><b>${esc(x.n)}</b><small>${esc(x.s)}</small></span>${badge(x.t, 'outline')}</button>`;

/* ============================== Modais ============================== */
const MODALS = {};
function openModal(m) { UI.modal = m; renderModal(); }
function closeModal() { UI.modal = null; renderModal(); }
function renderModal() {
  const root = $('#modal-root');
  if (!UI.modal) { root.hidden = true; root.innerHTML = ''; return; }
  const r = MODALS[UI.modal.type](UI.modal);
  root.hidden = false;
  root.innerHTML = `<div class="modal-back" data-act="closeModal"></div><div class="modal ${r.size || ''}" role="dialog" aria-modal="true" aria-label="${esc(r.title)}"><div class="modal-h"><h2>${esc(r.title)}</h2><button class="icon-btn" data-act="closeModal" aria-label="Fechar">${ic('x', 20)}</button></div><div class="modal-b">${r.body}</div>${r.foot ? `<div class="modal-f">${r.foot}</div>` : ''}</div>`;
  const f = $('.modal [autofocus], .modal input:not([type=hidden]), .modal textarea, .modal select', root); if (f && !('ontouchstart' in window)) f.focus();
}
const cancelBtn = `<button type="button" class="btn" data-act="closeModal">Cancelar</button>`;
const submitBtn = (t, icon = 'check') => `<button type="submit" form="mform" class="btn primary">${ic(icon, 16)} ${t}</button>`;
const procOpts = sel => `<option value="">Sem Trabalho Padrão cadastrado</option>${S.procedures.filter(isPub).map(p => `<option value="${p.id}" ${sel === p.id ? 'selected' : ''}>${esc(p.name)}</option>`).join('')}`;
const statusOpts = sel => EXEC_STATUS.map(s => `<option ${sel === s ? 'selected' : ''}>${s}</option>`).join('');

MODALS.detail = m => {
  const i = getInst(m.inst); if (!i) return { title: 'Atividade', body: '<p>Atividade não encontrada.</p>' };
  const a = i.a, st = instStatus(i), p = a.procId ? proc(a.procId) : null, std = isPub(p), notes = S.notes[i.id] || [];
  const last = S.executions.filter(e => e.actId === a.id).sort((x, y) => y.date.localeCompare(x.date)).slice(0, 5), mine = UI.p === 'c';
  return { title: 'Detalhes da atividade', size: 'wide', body: `
    <dl class="kv"><dt>Atividade</dt><dd><b>${esc(a.name)}</b></dd><dt>Descrição</dt><dd>${esc(a.description || '—')}</dd><dt>Data e horário</dt><dd>${fmtShort(i.date)} às ${i.time}</dd>
      <dt>Frequência</dt><dd>${a.frequency}</dd><dt>Tempo de referência</dt><dd>${fmtMin(a.refMin)}</dd><dt>Situação</dt><dd>${badge(st, ST_KIND[st])}</dd>
      <dt>Colaborador</dt><dd>${person(a.userId)}</dd><dt>Trabalho Padrão</dt><dd>${std ? `${esc(p.name)} · v${p.version}` : badge('Sem Trabalho Padrão cadastrado', 'dashed')}</dd>
      ${std ? `<dt>Responsável pelo processo</dt><dd>${person(p.owner)}</dd>` : ''}</dl>
    ${notes.length ? `<div class="sec-t">Observações</div><ul class="mini-list">${notes.map(n => `<li><span>${esc(n.text)}</span><span style="color:var(--muted)">${fmtDate(n.date)}</span></li>`).join('')}</ul>` : ''}
    ${last.length ? `<div class="sec-t">Últimos registros</div><ul class="mini-list">${last.map(e => `<li><span>${fmtDate(e.date)} · ${e.status}</span><b>${e.realMin} min <span style="font-weight:400;color:var(--muted)">(ref. ${e.refMin || '—'})</span></b></li>`).join('')}</ul>` : ''}`,
    foot: `<button class="btn" data-act="std" data-p="${std ? p.id : ''}" data-inst="${i.id}">${ic('book', 16)} Consultar procedimento</button>
      ${mine ? `<button class="btn" data-act="noteOpen" data-inst="${i.id}">${ic('note', 16)} Observação</button><button class="btn" data-act="resched" data-inst="${i.id}">${ic('swap', 16)} Reagendar</button><button class="btn" data-act="actEdit" data-id="${a.id}" data-date="${i.date}">${ic('edit', 16)} Editar</button><button class="btn" data-act="manualNew" data-id="${a.id}" data-date="${i.date}">Registrar tempo</button>
      ${st === 'Em andamento' ? `<button class="btn primary" data-act="openTimer">Abrir cronômetro</button>` : !IDX[i.id] ? `<button class="btn primary" data-act="start" data-inst="${i.id}">${ic('play', 16)} Iniciar atividade</button>` : ''}` : ''}` };
};

MODALS.exec = m => {
  const t = S.timer, i = getInst(m.inst); if (!i) return { title: 'Atividade', body: '' };
  const a = i.a, p = a.procId ? proc(a.procId) : null;
  if (m.stage === 'confirm') {
    const mins = Math.max(1, Math.round(m.elapsed / 60000));
    return { title: 'Confirmar registro de tempo', size: 'sm', body: `<form id="mform" data-submit="execSave">
      <p style="margin-bottom:12px"><b>${esc(a.name)}</b><br><span style="color:var(--muted)">Tempo cronometrado (sem as pausas): <b>${clock(m.elapsed / 1000)}</b>. Ajuste se precisar antes de salvar.</span></p>
      <div class="row2"><div class="field"><label for="mins">Tempo real (min)</label><input id="mins" name="mins" type="number" min="1" step="1" value="${mins}" required></div>
      <div class="field"><label for="est">Status da execução</label><select id="est" name="status">${statusOpts('Concluída')}</select></div></div>
      <div class="field"><label for="obs">Observação (opcional)</label><textarea id="obs" name="note" placeholder="Algo que ajude a entender o processo, como um bloqueio ou uma etapa confusa">${esc((t && t.note) || '')}</textarea></div>
      <p style="color:var(--muted);font-size:12.5px">Tempo de referência: ${fmtMin(a.refMin)}. Este registro serve para analisar processos, não para avaliar pessoas.</p></form>`,
      foot: `<button class="btn" data-act="execBack">Voltar ao cronômetro</button>${submitBtn('Salvar registro')}` };
  }
  if (!t) return { title: 'Execução', body: '<p>Nenhuma atividade em andamento.</p>' };
  const sec = elapsedMs() / 1000, pct = a.refMin ? Math.min(100, sec / 60 / a.refMin * 100) : 0, chk = t.checks || {};
  return { title: 'Executando atividade', size: 'wide', body: `<div class="tm"><div class="tm-name">${esc(a.name)}</div>
    <div class="tm-clock" data-clock>${clock(sec)}</div><div>${t.running ? badge('Em execução', 'teal') : badge('Pausada', 'amber')}</div>
    ${a.refMin ? `<div class="tm-bar"><i data-prog style="width:${pct}%"></i></div>` : ''}
    <div class="tm-ref">Tempo de referência: ${fmtMin(a.refMin)} · o cronômetro conta só o tempo ativo, descontando as pausas</div>
    <div class="tm-btns">${t.running ? `<button class="btn" data-act="pause">${ic('pause', 16)} Pausar</button>` : `<button class="btn" data-act="resume">${ic('play', 16)} Retomar</button>`}<button class="btn primary" data-act="finish">${ic('stop', 16)} Finalizar</button></div></div>
    ${isPub(p) ? `<div class="sec-t">Trabalho Padrão · ${esc(p.name)}</div><ol class="steps">${p.steps.map((s, k) => `<li class="step ${chk[k] ? 'ok' : ''}"><label><input type="checkbox" data-timerchk="${k}" ${chk[k] ? 'checked' : ''}><span class="n">${k + 1}</span><span><b>${esc(s.t)}</b>${s.d ? `<p>${esc(s.d)}</p>` : ''}</span></label></li>`).join('')}</ol>` : `<div class="note">${ic('info', 16)}<div>Sem Trabalho Padrão cadastrado para esta atividade. Você pode registrar o tempo normalmente.</div></div>`}
    <div class="field" style="margin-top:14px"><label for="tnote">Observação (opcional)</label><textarea id="tnote" data-timernote placeholder="Anote algo importante desta execução">${esc(t.note || '')}</textarea></div>`,
    foot: `<button class="btn danger" data-act="discard">Descartar execução</button><button class="btn" data-act="demoPlus" title="Apenas para demonstração">Demo: +5 min</button><button class="btn" data-act="manualNew" data-id="${a.id}" data-date="${i.orig}">Informar tempo manualmente</button>` };
};

MODALS.manual = m => {
  const mine = S.activities.filter(a => a.userId === ME.c).sort((a, b) => a.name.localeCompare(b.name, 'pt-BR'));
  return { title: 'Registrar tempo manualmente', size: 'sm', body: `<form id="mform" data-submit="manualSave">
    <div class="field"><label for="ma">Atividade</label><select id="ma" name="act">${mine.map(a => `<option value="${a.id}" ${m.id === a.id ? 'selected' : ''}>${esc(a.name)}</option>`).join('')}</select></div>
    <div class="row2"><div class="field"><label for="md">Data</label><input id="md" name="date" type="date" max="${TODAY}" value="${m.date && m.date <= TODAY ? m.date : TODAY}" required></div>
    <div class="field"><label for="mm">Tempo real (min)</label><input id="mm" name="mins" type="number" min="1" step="1" required></div></div>

MODALS.note = m => {

  return { title: 'Adicionar observação', size: 'sm', body: `<form id="mform" data-submit="noteSave"><p style="margin-bottom:10px;color:var(--muted)">${esc(i ? i.a.name : '')} · ${i ? fmtShort(i.date) : ''}</p>

    ${ex.length ? `<div class="sec-t">Observações anteriores</div><ul class="mini-list">${ex.map(n => `<li><span>${esc(n.text)}</span><span style="color:var(--muted)">${fmtDate(n.date)}</span></li>`).join('')}</ul>` : ''}</form>`, foot: cancelBtn + submitBtn('Salvar observação') };
};

function nextOcc(a) { for (let d = TODAY, k = 0; k < 62; d = D.add(d, 1), k++) if (occursOn(a, d)) return d; return TODAY; }
MODALS.actForm = m => {
  const a = m.id ? act(m.id) : null, mgr = UI.p === 'g';

/* ============================== Formulário de procedimento ============================== */
const blankProc = name => ({ id: null, name: name || '', category: CATS[0], description: '', objective: '', frequency: 'Diária', refMin: '', owner: 'u3', capable: [], steps: [{ t: '', d: '' }], systems: '', docs: '', materials: '', summary: '' });
const procToForm = p => ({ ...p, refMin: p.refMin ?? '', systems: p.systems.join('\n'), docs: p.docs.map(d => d.n).join('\n'), materials: p.materials.map(d => d.n).join('\n'), steps: p.steps.map(s => ({ ...s })), capable: [...p.capable], summary: '' });
